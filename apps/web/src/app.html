<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="csp-nonce" content="%sveltekit.nonce%" />
		<meta name="color-scheme" content="light dark" />
		<!-- Theme before first paint (no flash): 'light' | 'dark' saved, otherwise follow the OS. -->
		<script nonce="%sveltekit.nonce%">
			(function () {
				var saved = null;
				try {
					saved = localStorage.getItem('theme');
				} catch (e) {}
				var dark =
					saved === 'dark' ||
					(saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.add(dark ? 'dark' : 'light');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
